plugins { id 'com.android.application' }
def appBuildNumber = Integer.parseInt(System.getenv('BUILD_NUMBER') ?: '1')
android {
 namespace 'bd.org.noorani.madrasa'
 compileSdk 35
 defaultConfig {
  applicationId 'bd.org.noorani.madrasa'
  minSdk 23
  targetSdk 35
  versionCode = appBuildNumber
  versionName = '1.0.' + appBuildNumber
 }
 signingConfigs {
  preview {
   storeFile file('../preview.keystore')
   storePassword 'android'
   keyAlias 'androiddebugkey'
   keyPassword 'android'
  }
 }
 buildTypes {
  release {
   signingConfig signingConfigs.preview
   minifyEnabled false
   debuggable false
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 lint { abortOnError true }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
