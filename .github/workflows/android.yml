name: Build Android APK and publish release
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and lint
        run: gradle -p android assembleRelease lintRelease --no-daemon --stacktrace
      - name: Verify APK signature and prepare download
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Noorani-Madrasa-v1.0.${BUILD_NUMBER}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "release/Noorani-Madrasa-v1.0.${BUILD_NUMBER}.apk"
          cd release
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: noorani-madrasa-apk
          path: release/*
          retention-days: 30
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${BUILD_NUMBER}" release/* --target "$GITHUB_SHA" --title "Noorani Madrasa v1.0.${BUILD_NUMBER}" --notes-file android/RELEASE_NOTES.md
